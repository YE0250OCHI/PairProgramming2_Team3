<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>タクシー管理システム(Root)</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-taxi"></i>
            <span>TMS</span>
        </div>
        <ul>

            <li onclick="showPage('dashboard')">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </li>

            <li onclick="showPage('createJob')">
                <i class="fa-solid fa-briefcase"></i>
                <span>Create JOB</span>
            </li>

            <li onclick="showPage('taxiState')">
                <i class="fa-solid fa-taxi"></i>
                <span>Taxi State</span>
            </li>

            <li onclick="showPage('history')">
                <i class="fa-solid fa-history"></i>
                <span>History</span>
            </li>

        </ul>

    </div>

    <!-- MAIN -->

    <div class="main">

        <!-- TOP BAR -->

        <div class="topbar">

            <h2>
                Taxi Management Dashboard
            </h2>



        </div>

        <!-- DASHBOARD -->

        <div id="dashboard" class="page active">
            <!-- DASHBOARD -->


            <div class="cards">

                <div class="card">
                    <h3>本日のアクティブジョブ</h3> <!-- Today's Active Jobs -->
                    <h2 id="activeJobsCount">0</h2>
                </div>

                <div class="card">
                    <h3>本日の完了ジョブ</h3> <!-- Today's Completed Jobs -->
                   <h2 id="completedJobsCount">0</h2>
                </div>

                <div class="card">
                    <h3>全タクシー</h3> <!-- Total Taxis -->
                   <h2 id="totalTaxiCount">0</h2>
                </div>

                <div class="card">
                    <h3>利用可能タクシー</h3> <!-- Available Taxis -->
                     <h2 id="availableTaxiCount">0</h2>
                </div>

            </div>

            <div class="toolbar">
                <!-- Added modern class and custom click handler state -->
                <button class="btn-reload" onclick="handleReload(this)">
                    <!-- Inline modern SVG spin icon -->
                    <svg xmlns="http://w3.org" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                        class="icon-refresh">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                        <path d="M3 3v5h5" />
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
                        <path d="M16 16h5v5" />
                    </svg>
                    <span>再読み込み</span> <!-- Japanese for "Reload / Refresh" -->
                </button>
            </div>

            <div class="table-wrapper">

                <table id="jobTable">

                    <thead>

                        <tr>
                            <th>Job ID</th>
                            <th>Job Status</th>
                            <th>FROM</th>
                            <th>TO</th>
                            <th>Taxi ID</th>
                            <th>Taxi Driver</th>
                            <th>Action</th>
                        </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- CREATE JOB -->
        <div id="createJob" class="page">

            <div class="form-card">
                <h3>Create New Job</h3> <!-- Create New JOB -->
                <!-- Horizontal flex wrapper for inputs, dropdown, and action button -->
                <div class="form-row-inputs">
                    <input id="fromInput" placeholder="FROM">
                    <input id="toInput" placeholder="TO">
                    <select id="taxiDropdown" disabled>
                        <option value="">Select Taxi</option> <!-- Loading Taxi... -->
                    </select>
                    <button onclick="submitJob()">Submit Job</button> <!-- Submit -->
                </div>
            </div>


        </div>

        <!-- TAXI STATE -->

        <div id="taxiState" class="page">

            <div class="table-wrapper">

                <table id="taxiTable">

                    <thead>

                        <tr>
                            <th>Taxi ID</th>
                            <th>Status</th>
                            <th>Driver</th>
                        </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

        <!-- HISTORY -->

        <div id="history" class="page">

            <div class="table-wrapper">

                <table id="historyTable">

                    <thead>

                        <tr>
                            <th>Job ID</th>
                            <th>Job Status</th>
                            <th>From</th>
                            <th>TO</th>
                            <th>Taxi ID</th>
                            <th>Driver Name</th>
                            <th>ClosedAt</th>
                        </tr>
                        </tr>
                        </tr>

                    </thead>

                    <tbody>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="js/app.js"></script>

</body>

</html>
